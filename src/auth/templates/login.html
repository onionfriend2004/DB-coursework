{% extends 'base.html' %}

{% block title %}Главное меню{% endblock %}

{% block content %}
<div class="container">
    <h2 class="my-4 text-center">Авторизация</h2>
    
    <!-- Сообщение об ошибке -->
    {% if error_message %}
        <div class="alert alert-danger" role="alert">
            {{ error_message }}
        </div>
    {% endif %}

    <form method="POST" action="" class="needs-validation" novalidate>
        <div class="mb-3">
            <label for="login" class="form-label">Логин</label>
            <input name="login" type="text" id="login" class="form-control" placeholder="Логин" required>
        </div>

        <div class="mb-3">
            <label for="password" class="form-label">Пароль</label>
            <input name="password" type="password" id="password" class="form-control" placeholder="Пароль" required>
        </div>

        <div class="text-center">
            <input type="submit" class="btn btn-primary btn-lg" value="Отправить">
        </div>
    </form>

    <p class="mt-3 text-center">
        <a href="{{ url_for('main_menu') }}" class="btn btn-link">Вернуться в главное меню</a>
    </p>
</div>
{% endblock %}
