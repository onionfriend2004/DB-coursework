{% extends 'base.html' %}

{% block title %}Главное меню{% endblock %}

{% block content %}
<div class="text-center">
    <h2 class="mb-4">Главное меню клиники</h2>
    {% if message %}
        <div class="alert alert-info" role="alert">
            {{ message }}
        </div>
    {% endif %}
    <div class="d-grid gap-3">
        <a href="{{ url_for('requests_bp.request_index') }}" class="btn btn-primary btn-lg">Работа с запросами</a>
        <a href="{{ url_for('appointment_bp.basket_index') }}" class="btn btn-primary btn-lg">Назначение приема</a>
        <a href="{{ url_for('report_bp.report_menu') }}" class="btn btn-primary btn-lg">Работа с отчетами</a>
        <a href="{{ url_for('auth_bp.auth_index') }}" class="btn btn-primary btn-lg">Авторизация</a>
        {% if auth_status %}
            <a href="{{ url_for('exit_func') }}" class="btn btn-primary btn-lg">Выход из системы</a>
        {% endif %}
    </div>
</div>
{% endblock %}
