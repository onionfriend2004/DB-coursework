{% extends 'base.html' %}

{% block title %}Запросы{% endblock %}

{% block header %}
    <a class="header" href="{{url_for('requests_bp.index_requests')}}">Меню запросов</a>
{% endblock %}

{% block content %}
    <h1>Шаг 4</h1>
    <h2>Врачи указанной специальности</h2>
    <form method="POST" action="">
        <label for="appointment">Выберите специальность:</label>
        <select name="appointment" id="appointment">
            {% for appointment in result %}
                <option value="{{ appointment['start'] }}|{{ appointment['end'] }}|{{ appointment['doctor_name'] }}|{{ appointment['doctor_id'] }}">
                    {{ appointment['start'] }} - {{ appointment['end'] }} - {{ appointment['doctor_name'] }}
                </option>
            {% endfor %}
        </select>
        <input type="submit" value="Отправить">
    </form>
    <a class="back" href="{{ prev_page }}">Назад</a>
{% endblock %}
