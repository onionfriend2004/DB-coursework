{% extends 'base.html' %}

{% block title %}Запросы{% endblock %}

{% block header %}
    <a class="header btn btn-primary btn-lg" href="{{url_for('appointment_bp.basket_index')}}">Создание записей</a>
{% endblock %}

{% block content %}
<div class="container mt-5">
    <h1 class="text-center">Шаг 4: Врачи указанной специальности</h1>
    <form method="POST" action="" class="mt-4">
        <div class="mb-3">
            <label for="appointment" class="form-label">Выберите специальность:</label>
            <select name="appointment" id="appointment" class="form-control" required>
                <option value="" disabled selected>Выберите специалиста</option>
                {% for appointment in result %}
                    <option value="{{ appointment['start'] }}|{{ appointment['end'] }}|{{ appointment['doctor_name'] }}|{{ appointment['doctor_id'] }}">
                        {{ appointment['start'] }} - {{ appointment['end'] }} - {{ appointment['doctor_name'] }}
                    </option>
                {% endfor %}
            </select>
        </div>
        
        <div class="d-flex justify-content-between">
            <a href="{{ prev_page }}" class="btn btn-secondary">Назад</a>
            <button type="submit" class="btn btn-primary">Отправить</button>
        </div>
    </form>
</div>
{% endblock %}
