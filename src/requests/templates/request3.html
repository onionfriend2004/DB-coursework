{% extends 'base.html' %}

{% block title %}Запросы{% endblock %}

{% block header %}
    <a class="text-white text-decoration-none h5" href="{{ url_for('requests_bp.index_requests') }}">Меню запросов</a>
{% endblock %}

{% block content %}
<div class="container">
    <h2 class="my-4 text-center">Диагнозы по ключевому слову</h2>
    <form action="{{ url_for('requests_bp.request_view', request_id='3') }}" method="post" class="form-group">
        <div class="mb-3">
            <label for="keyword" class="form-label">Укажите ключевое слово:</label>
            <input type="text" id="keyword" name="keyword" class="form-control" required>
        </div>
        <div class="text-center">
            <input type="submit" value="Отправить" class="btn btn-primary btn-lg">
        </div>
    </form>
</div>
{% endblock %}
