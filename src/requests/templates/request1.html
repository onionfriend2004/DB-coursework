{% extends 'base.html' %}

{% block title %}Запросы{% endblock %}

{% block header %}
    <a class="header" href="{{url_for('requests_bp.index_requests')}}">Меню запросов</a>
{% endblock %}

{% block content %}
    <h2>Количество приписавшихся к поликлинике за указанный год по месяцам</h2>
    <form action="{{ url_for('requests_bp.request_view', request_id='1') }}" method="post">
        <label for="year">Укажите год:</label>
        <input type="number" id="year" name="year" min="2000" required>
        <input type="submit" value="Отправить">
    </form>
{% endblock %}
