{% extends 'base.html' %}

{% block title %}Запросы{% endblock %}

{% block header %}
    <a class="header" href="{{url_for('requests_bp.index_requests')}}">Меню запросов</a>
{% endblock %}

{% block content %}
    <h2>Врачи, нанятые в указанные год и месяц</h2>
    <form action="{{ url_for('requests_bp.request_view', request_id='4') }}" method="post">
        <label for="year">Укажите год:</label>
        <input type="number" id="year" name="year" min="2000" required>
        <label for="month">Укажите месяц:</label>
        <input type="number" id="month" name="month" min="1" max="12" required>
        <input type="submit" value="Отправить">
    </form>
{% endblock %}
