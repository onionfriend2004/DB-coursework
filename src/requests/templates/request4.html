{% extends 'base.html' %}

{% block title %}Запросы{% endblock %}

{% block header %}
    <a class="header" href="{{ url_for('requests_bp.index_requests') }}">Меню запросов</a>
{% endblock %}

{% block content %}
<div class="container">
    <h2 class="my-4 text-center">Врачи, нанятые в указанные год и месяц</h2>
    <form action="{{ url_for('requests_bp.request_view', request_id='4') }}" method="post" class="form-group">
        <div class="mb-3">
            <label for="year" class="form-label">Укажите год:</label>
            <input type="number" id="year" name="year" class="form-control" min="2000" required>
        </div>
        <div class="mb-3">
            <label for="month" class="form-label">Укажите месяц:</label>
            <input type="number" id="month" name="month" class="form-control" min="1" max="12" required>
        </div>
        <div class="text-center">
            <input type="submit" value="Отправить" class="btn btn-primary btn-lg">
        </div>
    </form>
</div>
{% endblock %}
