{% extends 'base.html' %}

{% block title %}Результат{% endblock %}

{% block header %}
    <a class="header" href="{{ url_for('report_bp.report_menu') }}">Меню отчётов</a>
{% endblock %}

{% block content %}
<div class="container">
    <h1 class="my-4 text-center">{{ status_title }}</h1>
    <h2 class="text-center">{{ status_msg }}</h2>
    
    <div class="text-center mt-4">
        <a href="{{ prev_page }}" class="btn btn-secondary btn-lg">Назад к вводу параметров</a>
    </div>
    
    {% if report_name %}
    <div class="text-center mt-3">
        <a href="{{ url_for('report_bp.view_report', name=report_name) }}" class="btn btn-primary btn-lg">Перейти к просмотру отчёта</a>
    </div>
    {% endif %}
</div>
{% endblock %}
