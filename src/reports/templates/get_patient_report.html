{% extends 'base.html' %}

{% block title %}Ввод параметров{% endblock %}

{% block header %}
    <a class="header" href="{{ url_for('report_bp.report_menu') }}">Меню отчётов</a>
{% endblock %}

{% block content %}
<div class="container">
    <h1 class="my-4 text-center">Открыть отчёт по количеству принятых пациентов каждым врачом</h1>
    
    <form method="POST" action="">
        <div class="mb-3">
            <label for="year_month" class="form-label">Выберите год и месяц:</label>
            <input type="month" id="year_month" name="year_month" class="form-control" min="2000-01" max="2030-12" required>
        </div>
        
        <div class="text-center">
            <input type="submit" class="btn btn-primary btn-lg" value="Открыть отчёт"/>
        </div>
    </form>
</div>
{% endblock %}
