{% extends 'base.html' %}

{% block title %}Меню отчётов{% endblock %}

{% block content %}
<div class="container">
    <h1 class="my-4 text-center">Меню отчетов</h1>

    <div class="row">
        {% for report in reports %}
        <div class="col-md-6 mb-4">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h3 class="card-title">{{ report.title }}</h3>
                    <a href="{{ url_for('report_bp.create_report', name=report.name) }}" class="btn btn-primary btn-block">Создать</a>
                    <a href="{{ url_for('report_bp.view_report', name=report.name) }}" class="btn btn-secondary btn-block mt-2">Просмотр</a>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
